<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — FinTech Admin Panel</title>
<link rel="icon" type="image/png" href="../assets/fintech-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chat.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-page="dashboard" data-title="Dashboard">
<template id="page-content">
<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-icon queries">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-value" id="sTotalQueries">0</span>
      <span class="stat-label">Total Queries</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon satisfaction">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-value" id="sSatisfaction">0%</span>
      <span class="stat-label">Satisfaction Rate</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon tokens">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-value" id="sTokens">0</span>
      <span class="stat-label">Tokens Used</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon feedback">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-value" id="sFeedback">0</span>
      <span class="stat-label">
        Feedback &nbsp;
        <span class="badge-pos"><span id="sPos">0</span>👍</span>
        <span class="badge-neg"><span id="sNeg">0</span>👎</span>
      </span>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon no-result">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </div>
    <div class="stat-body">
      <span class="stat-value" id="sNoResult">0</span>
      <span class="stat-label">No-Answer Queries</span>
    </div>
  </div>
</div>

<div class="dash-row">
  <!-- Top intents -->
  <div class="admin-card flex-1">
    <h3 class="card-title">Top Intents</h3>
    <div id="intentList"></div>
  </div>

  <!-- Recent queries -->
  <div class="admin-card flex-2">
    <div class="card-title-row">
      <h3 class="card-title">Recent Queries</h3>
      <a href="queries.html" class="card-link">View all →</a>
    </div>
    <div id="recentQueries"></div>
  </div>
</div>
</template>
<script src="../config.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  if (!Admin.mounted) return;
  const { esc, truncate, fmtTime, resultBadge } = Admin;
  const $ = (id) => document.getElementById(id);

  Admin.api("/api/admin/dashboard").then((s) => {
    $("sTotalQueries").textContent = s.total_queries;
    $("sSatisfaction").textContent = s.satisfaction_rate + "%";
    $("sTokens").textContent = Number(s.total_tokens || 0).toLocaleString("en-US");
    $("sFeedback").textContent = s.total_feedback;
    $("sPos").textContent = s.positive_feedback;
    $("sNeg").textContent = s.negative_feedback;
    $("sNoResult").textContent = s.no_result_count;

    const intents = s.top_intents || [];
    if (intents.length) {
      const max = intents[0][1] || 1;
      $("intentList").innerHTML = '<div class="intent-list">' + intents.map(([name, count]) =>
        '<div class="intent-row"><span class="intent-name">' + esc(name) + '</span>' +
        '<div class="intent-bar-wrap"><div class="intent-bar" style="width:' + Math.floor(count / max * 100) + '%"></div></div>' +
        '<span class="intent-count">' + count + '</span></div>').join("") + "</div>";
    } else {
      $("intentList").innerHTML = '<p class="empty-state">No query data yet.</p>';
    }

    const recent = s.recent_queries || [];
    $("recentQueries").innerHTML = recent.length
      ? '<div class="table-wrap"><table class="admin-table"><thead><tr><th>Query</th><th>Intent</th><th>Result</th><th>Time</th></tr></thead><tbody>' +
        recent.map((r) => '<tr><td class="td-query">' + esc(truncate(r.query_text, 60)) + '</td><td><span class="intent-chip">' + esc(r.intent) +
          '</span></td><td>' + resultBadge(r.had_result) + '</td><td class="td-muted">' + esc(fmtTime(r.created_at)) + '</td></tr>').join("") +
        "</tbody></table></div>"
      : '<p class="empty-state">No recent queries.</p>';
  }).catch((e) => {
    $("intentList").innerHTML = '<p class="empty-state">' + esc(e.message) + "</p>";
  });
})();
</script>
</body>
</html>
