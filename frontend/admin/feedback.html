<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Feedback — FinTech Admin Panel</title>
<link rel="icon" type="image/png" href="../assets/fintech-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chat.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-page="feedback" data-title="User Feedback">
<template id="page-content">
<div class="admin-card">
  <div class="filter-bar">
    <select id="ratingFilter">
      <option value="">All Ratings</option>
      <option value="positive">👍 Positive</option>
      <option value="negative">👎 Negative</option>
    </select>
    <span class="filter-count" id="filterCount"></span>
  </div>

  <div class="table-wrap">
    <table class="admin-table">
      <thead><tr>
        <th>Rating</th><th>Query</th><th>Service</th><th>Intent</th><th>Comment</th><th>Time</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="pager"></div>
</div>
</template>
<script src="../config.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  if (!Admin.mounted) return;
  const { esc, truncate, fmtTime } = Admin;
  const $ = (id) => document.getElementById(id);
  const state = { page: 1 };

  async function load() {
    const params = new URLSearchParams({ page: state.page, rating: $("ratingFilter").value });
    try {
      const d = await Admin.api("/api/admin/feedback?" + params);
      $("filterCount").textContent = d.total + " record" + (d.total === 1 ? "" : "s");
      $("rows").innerHTML = d.rows.length ? d.rows.map((r) =>
        '<tr><td style="font-size:18px;text-align:center">' + (r.rating === 1 ? "👍" : r.rating === -1 ? "👎" : "—") + '</td>' +
        '<td class="td-query">' + esc(r.query_text ? truncate(r.query_text, 70) : "—") + '</td>' +
        '<td class="td-muted">' + esc(r.service || "—") + '</td>' +
        '<td><span class="intent-chip">' + esc(r.intent || "—") + '</span></td>' +
        '<td class="td-muted">' + esc(r.comment || "—") + '</td>' +
        '<td class="td-muted">' + esc(fmtTime(r.created_at)) + '</td></tr>').join("")
        : '<tr><td colspan="6" class="empty-state">No feedback yet.</td></tr>';
      $("pager").innerHTML = Admin.pagination(d.page, d.total_pages);
    } catch (e) {
      $("rows").innerHTML = '<tr><td colspan="6" class="empty-state">' + esc(e.message) + "</td></tr>";
    }
  }

  $("ratingFilter").addEventListener("change", () => { state.page = 1; load(); });
  $("pager").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-page]");
    if (btn) { state.page = Number(btn.dataset.page); load(); }
  });
  load();
})();
</script>
</body>
</html>
