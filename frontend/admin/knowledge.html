<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — FinTech Admin Panel</title>
<link rel="icon" type="image/png" href="../assets/fintech-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/chat.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-page="knowledge" data-title="Knowledge Base">
<template id="page-content">
<div class="dash-row kb-layout">

  <!-- Upload new file -->
  <div class="admin-card kb-upload-card">
    <div class="kb-card-header">
      <div class="kb-card-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div>
        <h3 class="card-title" style="margin-bottom:2px">Upload Document</h3>
        <p class="card-sub" style="margin-bottom:0">Add PDF, TXT, or DOCX to a department's knowledge base.</p>
      </div>
    </div>

    <div class="kb-divider"></div>

    <form id="kbUploadForm" class="kb-form">
      <div class="kb-field">
        <label class="kb-label">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Department
        </label>
        <select name="department_id" id="kbDepartment" class="kb-select" required>
          <option value="" disabled selected>Select department</option>

        </select>
      </div>

      <div class="kb-field">
        <label class="kb-label">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
          File
        </label>
        <label class="kb-file-drop" id="kbFileDrop">
          <input type="file" name="file" id="kbFileInput" accept=".pdf,.txt,.docx" required style="display:none">
          <div class="kb-file-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <span class="kb-file-label" id="kbFileLabel">Click to choose a file</span>
          <span class="kb-file-types">PDF · TXT · DOCX</span>
        </label>
      </div>

      <button type="submit" class="kb-submit-btn" id="kbSubmitBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload &amp; Ingest
      </button>

      <div id="kbStatus" class="kb-status" style="display:none"></div>
    </form>
  </div>

  <!-- Ingested files table -->
  <div class="admin-card flex-2 kb-files-card">
    <div class="kb-card-header" style="margin-bottom:16px">
      <div class="kb-card-icon kb-card-icon-green">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <h3 class="card-title" style="margin-bottom:2px">Ingested Files</h3>
        <p class="card-sub" style="margin-bottom:0">Documents currently in the knowledge base.</p>
      </div>
    </div>
    <div class="table-wrap">
      <table class="admin-table kb-table">
        <thead>
          <tr>
            <th>
              <span class="th-inner">
                <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                File
              </span>
            </th>
            <th>
              <span class="th-inner">
                <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Department
              </span>
            </th>
            <th>
              <span class="th-inner">
                <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Uploaded
              </span>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody id="kbFiles">

        </tbody>
      </table>
    </div>
  </div>

</div>
</template>
<script src="../config.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  if (!Admin.mounted) return;
  const { esc, fmtTime } = Admin;
  const $ = (id) => document.getElementById(id);
  const TRASH = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  const SPIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-18 0"/></svg>';
  const UPLOAD = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
  const EMPTY_ROW = '<tr><td colspan="4" class="kb-empty-state"><div class="kb-empty-icon"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div><p>No files ingested yet.</p><span>Upload a document to get started.</span></td></tr>';
  let files = [];

  function renderFiles() {
    $("kbFiles").innerHTML = files.length ? files.map((f) => {
      const name = f.original_file_name || "—";
      const ext = name.includes(".") ? name.split(".").pop().toUpperCase() : "FILE";
      return '<tr id="file-row-' + esc(f.id) + '"><td><div class="kb-file-row"><div class="kb-file-ext">' + esc(ext) + '</div><span class="td-query">' + esc(name) + '</span></div></td>' +
        '<td><span class="intent-chip">' + esc(f.department_name) + '</span></td>' +
        '<td class="td-muted">' + esc(fmtTime(f.created_at)) + '</td>' +
        '<td><button class="kb-delete-btn" data-id="' + esc(f.id) + '" title="Delete file">' + TRASH + '</button></td></tr>';
    }).join("") : EMPTY_ROW;
  }

  async function load() {
    try {
      const d = await Admin.api("/api/admin/knowledge");
      files = d.files || [];
      const depts = d.departments || [];
      $("kbDepartment").innerHTML = '<option value="" disabled selected>Select department</option>' +
        depts.map((x) => '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>").join("");
      $("kbDepartment").disabled = !depts.length;
      renderFiles();
    } catch (e) {
      $("kbFiles").innerHTML = '<tr><td colspan="4" class="empty-state">' + esc(e.message) + "</td></tr>";
    }
  }

  $("kbFiles").addEventListener("click", async (e) => {
    const btn = e.target.closest(".kb-delete-btn");
    if (!btn) return;
    const file = files.find((f) => String(f.id) === btn.dataset.id);
    if (!confirm('Delete "' + (file ? file.original_file_name : "this file") + '"?\n\nThis will also remove all its chunks from the knowledge base.')) return;
    btn.disabled = true;
    btn.innerHTML = SPIN;
    try {
      await Admin.api("/api/admin/files/" + encodeURIComponent(btn.dataset.id), { method: "DELETE" });
      const row = btn.closest("tr");
      row.style.transition = "opacity 0.3s, transform 0.3s";
      row.style.opacity = "0";
      row.style.transform = "translateX(10px)";
      files = files.filter((f) => String(f.id) !== btn.dataset.id);
      setTimeout(renderFiles, 320);
    } catch (err) {
      alert("Delete failed: " + err.message);
      btn.disabled = false;
      btn.innerHTML = TRASH;
    }
  });

  $("kbFileInput").addEventListener("change", function () {
    $("kbFileLabel").textContent = this.files[0] ? this.files[0].name : "Click to choose a file";
  });

  $("kbUploadForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const btn = $("kbSubmitBtn");
    const status = $("kbStatus");
    btn.disabled = true;
    btn.innerHTML = SPIN + " Uploading…";
    status.style.display = "none";
    status.className = "kb-status";
    try {
      const data = await Admin.api("/api/upload", { method: "POST", body: new FormData(this) });
      status.className = "kb-status success";
      status.textContent = data.message || "Uploaded & ingested successfully.";
      this.reset();
      $("kbFileLabel").textContent = "Click to choose a file";
      load();
    } catch (err) {
      status.className = "kb-status error";
      status.textContent = err.message;
    } finally {
      status.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = UPLOAD + " Upload &amp; Ingest";
    }
  });

  load();
})();
</script>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
