# Render hosts only the static frontend. The backend + PostgreSQL run on the Oracle Cloud VM
# (see docs/DEPLOY.md and docker-compose.prod.yml).
services:
  - type: web
    name: fintech-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: sh ./render-build.sh
    staticPublishPath: .
    envVars:
      # Public HTTPS URL of the backend, no trailing slash, e.g. https://chat.1-2-3-4.sslip.io
      - key: API_BASE_URL
        sync: false
    # Short admin URL: /admin -> login page (which forwards to the dashboard when already signed in)
    routes:
      - type: redirect
        source: /admin
        destination: /admin/login.html
      - type: redirect
        source: /admin/
        destination: /admin/login.html
